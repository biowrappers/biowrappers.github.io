---
layout: default
---

<article class="content-page">
  <header>
    <hgroup>
      <h1>{{ page.title }}</h1>
      {% if page.description %}
        <p>{{ page.description }}</p>
      {% endif %}
    </hgroup>
    {% if page.date %}
      <p><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time></p>
    {% endif %}
  </header>
  {{ content }}
</article>
