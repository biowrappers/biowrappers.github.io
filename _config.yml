title: BioWrappers
description: BioWrappers is a collection of lightweight wrappers around common bioinformatics APIs and tools, designed to make them easier to use in reproducible workflows.
url: "https://biowrappers.github.io"
baseurl: ""
repository_url: "https://github.com/biowrappers/biowrappers.github.io"
issues_url: "https://github.com/biowrappers/biowrappers.github.io/issues"
github_edit_branch: "main"
social_image: "/biowrappers_logo.png"
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: content

collections:
  posts:
    output: true
